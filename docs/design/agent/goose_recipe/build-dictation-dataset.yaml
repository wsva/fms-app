version: 1.0.0
title: build-dictation-dataset
description: Drive one dictation dataset to a prepared state through the workflow engine - subtitles, waveforms, cue alignment, silence-snapping - with every step measured against the disk and recorded in a resumable run.
instructions: |-
  # Build a Dictation Dataset (engine-driven)

  ## Goal
  Take one dictation dataset from whatever state it is in to a fully prepared one - media registered, subtitles generated *and* imported, waveforms, cues aligned to `book.txt` / `transcript/` when they exist, cue times snapped to silence - while recording every transition in a workflow run stored inside the dataset.

  This recipe drives the **workflow engine** rather than calling pipeline tools in a fixed order, so:
  - the run is resumable across sessions and crashes;
  - the app's Workflow page shows the same state you see;
  - steps the dataset already satisfies are adopted as completed instead of being re-run.

  The pipeline definition is `build_dictation_dataset` (built into the binary). Read it with `workflow_builtin_templates`; the file in the repo (`src-tauri/src/workflow/templates/dictation/build_dictation_dataset.yaml`) is the same text, but never read files out of the source tree when a tool returns them.

  ## Prerequisites
  - fms-app desktop running. It starts its web service on launch, and the MCP server is mounted on that at `http://127.0.0.1:35711/mcp` (Streamable HTTP, rmcp) - that URL is what goose connects to. If the port was taken, `web_service_get_status` reports the bound one.
  - A dataset uuid (from `dataset_list`), or a folder path holding `media/` when the dataset does not exist yet - `init_dataset` mints the uuid. If the user named neither, list the datasets and ask which one to work on before calling anything else.
  - An STT model for the transcription step: `model_status` -> `model_download` -> `model_load`. `dataset_full_report` tells you whether one is loaded.

  ## Workflow

  ### Step 0: One report instead of five calls
  Call **`dataset_full_report`** with the dataset uuid. It is read-only and writes nothing, and it already includes the STT model state - do **not** also call `model_status`, `dataset_audit`, `workflow_list` or `workflow_status` to start: each re-sends what this one returned.

  Read `hint` first - it names the next call. Then, in this order:
  - `audit.facts` - the six guard facts (`has_media`, `has_subtitles`, `has_waveforms`, `has_database`, `has_book`, `has_transcript`) that a step's `when:` reads.
  - `audit.checks[]` - every check with a stable `id`, an exact `count`, `advice` and a sample of at most 5 offenders in `items`. When the sampled offenders share one finding it is hoisted into `item_detail` with `<file>` standing for each name and `items` becomes a plain list of file names; `items_omitted` counts those not shown. **`count: 0` means measured and clean; an id that is absent from the list means not measured and proves nothing.** Need the full list of offenders? That is what `dataset_audit` is for.
  - `audit.media_on_disk` vs `audit.media_in_db`, `subtitles_in_db`, `cues_in_db`.
  - `workflow.runs[]` - one entry per run recorded inside the dataset, **ordered by the run you should act on**: the primary workflow's run (`workflow.canonical_run_id`) first, then the most advanced. Each entry has `steps` (per-step status), `verdicts` (only for `completed` steps - a verdict on work nobody has done yet proves nothing), `ready` / `blocked` / `failed`, the engine's `hints`, and `next.steps` with each runnable step's `action` and its `params` / `inputs` already resolved.
  - `workflow.expected_runs[]` - the run id of every built-in template of this dataset's kind, `present: true` on the ones that exist on disk. A dataset legitimately carries one run **per workflow** - `dictation-<uuid>` is the build workflow, `dictation-sync_cue_times-<uuid>` is the cue-time sync - so this is how you name a run without inventing one.
  - `stt_model.active_version` - `null` means transcription will fail.

  ### Step 1: Get a run to work in
  Work in the run named `dictation-<uuid>` - `workflow.canonical_run_id` says it, and it is the id the app's Workflow page reads and writes while the build workflow is open. **Never `workflow_create` a run of your own devising**: two runs are two separate histories, and progress recorded in the stray one is invisible in the one the user sees.

  **If no run named `dictation-<uuid>` is in `workflow.runs[]`:**
  1. Call `workflow_builtin_templates` and take the `build_dictation_dataset` entry's `yaml`.
  2. Call `workflow_adopt` with `dataset_uuid`, `run_id: "dictation-<uuid>"` and `definition_yaml` set to that yaml. Do this even when *other* runs already exist - their record is not this run's.

  `workflow_adopt` opens the run *and* marks `completed` every step whose `adopt:` checks were all measured clean - so a dataset prepared by hand, by another device or by an earlier session shows its real state instead of offering work already done. Read:
  - `adoption.adopted` - the steps it marked completed without running.
  - `adoption.withheld[]` - the steps it refused, each with `why`: `"not measured"` (the check could not run) or `"the evidence disagrees"` (the check found offenders).
  - `adoption.refreshed` / `adoption.refresh_error` - whether the run was rebound to the current template text. Only a run whose history holds nothing but inherited progress can be rebound; a run that earned progress keeps the definition it was created from - including its lease rules.
  - `adopt_hint` - one sentence saying the same.

  **If a run already exists**, do not create another. If `workflow.runs[0].error` is set the run is unreadable - tell the user before recreating or removing `<dataset>/workflows/<run_id>`.

  ### Step 2: Reconcile the record with the disk
  Call `workflow_verify` with `dataset_uuid` and `run_id` and no `apply`, so it writes nothing. Read `verdicts`:
  - `verified` - the artifacts this step claims exist and agree with each other.
  - `drifted` - a `proves` check has offenders, so a `completed` step is contradicted.
  - `unknown` - the step binds no checks, or a bound id was not measured (`undecidable` lists which).

  If `verification.drifted` is non-empty: show the user which steps drifted and the offending files (from `audit.checks[].items`), then call `workflow_verify` again with `apply: true`. That is the only way a `completed` step returns to `ready`, and it costs an `invalidated` event. Never mark a drifted step complete yourself - re-run its action.

  ### Step 3: Run what is runnable, one step at a time
  Call `workflow_next` with `dataset_uuid` and `run_id`. It returns `steps[]`, each with `id`, `action`, `params`, resolved `inputs` and `declared_outputs`. Then, per step:
  1. `workflow_advance` with `dataset_uuid`, `run_id`, `step`, `agent_id: "goose"` - claims a lease, so two agents cannot run the same step, and hands back the action to perform. Its `lease_secs` is how long that claim is honoured: after that the engine assumes the work died, returns the step to `ready` and lets it be re-claimed - so a step you are still working on would be done twice. The long steps in this pipeline carry a `timeout:` of their own for exactly that reason; if a step's `lease_secs` is too small for the work on this machine, say so to the user rather than working around it.
  2. Perform the action (table below): call the tool the response names in `action`, with exactly the `params` it handed back - they already carry the dataset `uuid` of the run you are in, so you never have to remember it. **Nothing but that tool returning counts as performing the step.** `workflow_record` is bookkeeping about a call you made, not about a number you read: `dataset_sync_media` was once skipped entirely while its step was recorded `completed` with counts copied from `dataset_full_report`.
  3. `workflow_record` with `dataset_uuid`, `run_id`, `step`, `event: "completed"` and `detail: { outputs: { ... } }` - include **every** name in `declared_outputs`, even when the value is the string `"false"`. The engine **refuses** a completion that omits one and writes nothing, so the step stays `running` and your corrected call lands on it: a dependent reading that name through a `when:` guard would otherwise sit `blocked` forever with nothing in the log naming the cause. (`values` may also sit straight on `detail` instead of under `outputs`; both are read.)
  4. On error: `workflow_record` with `event: "failed"` and `detail: { reason: "<the tool's message>" }`. Steps that declare `retry` go back to `ready` on their own until the attempts run out; the rest become `failed` immediately.

  Repeat until `workflow_next` returns no steps. When it returns none but its `claimed[]` is not empty, that claim is why nothing can run - report it (step 3.3 or 3.4) before anything else; do not wait on it or re-advance it. Do not run a `blocked` step - it is waiting on a dependency's output, and `workflow_advance` will name it for you. A step whose `when:` guard is false is `skipped` by the engine; never force it with `workflow_intervene`. **Do not end your turn on a step you have claimed and not reported**: it then sits `running` under your lease while nothing is running, and `dataset_full_report` will read "stalled" - which is what it means, and what you have to fix first.

  ### Step 4: Action table

  | step | action tool | params | record as `outputs` |
  |---|---|---|---|
  | `ensure_model` | `model_status` -> `model_download` -> `model_load` | `version` | `model_version` |
  | `init_dataset` | `dataset_init_dir` | `path` (folder already holding `media/`) | `dataset_uuid`, `media_count` |
  | `sync_media` | `dataset_sync_media` | `uuid` | `added_count`, `removed_count` |
  | `generate_subtitles` | `dataset_generate_subtitles` | `uuid` | - |
  | `generate_waveforms` | `dataset_generate_waveforms` | `uuid` | - |
  | `detect_reference` | `dataset_list_files` | `uuid` | `has_book`, `has_transcript` |
  | `align_cues` | `dataset_align_cues` | `uuid` | - |
  | `align_cues_transcript` | `dataset_align_cues_transcript` | `uuid` | - |
  | `adjust_cue_times` | `dataset_adjust_cue_time` | `uuid`, `mode`, `strategy` | - |

  Per-action notes:
  - `init_dataset` takes a **path**, not a uuid - it mints the uuid, writes `info.json` and creates an empty `data.sqlite3`. Every later step uses the uuid.
  - `ensure_model` has no `verify:` binding, so its status comes only from what you record. Report the loaded `model_version` explicitly.
  - `generate_subtitles` transcribes **and** imports: an active `listen_subtitle` plus version-1 cues per media, written idempotently. There is no "build database" step in this pipeline; `dataset_write_subtitles_to_db` is an offline repair tool, not a stage.
  - **A long step is incremental, not atomic.** `dataset_generate_subtitles` transcribes inline and can run for many minutes over a few dozen files; its response says how many it generated and how many it skipped. If your client times out on it, you lost the *response*, not the work - the media that got a VTT are never transcribed twice. Call it again, or poll `dataset_audit` until `subtitles_missing` is `0`, and record the step once the files agree. `dataset_generate_subtitle_single` / `dataset_generate_waveform_single` are the per-file forms when one call is too big to wait for.
  - `detect_reference` decides two guards. Report `has_book` / `has_transcript` as the strings `"true"` / `"false"` from `dataset_list_files` (and from `audit.facts`, which already knows both).
  - `align_cues` and `align_cues_transcript` are independent of each other, not a sequence: each is guarded by its own material (`book.txt` / `transcript/`), and both run when both exist. Each sets the cue `reference` field; neither changes cue text.
  - `adjust_cue_times` defaults to `mode: "new"` - adjusted cues are written as a new subtitle version alongside the originals. Use `mode: "in_place"` only when the user asks, and `force: true` only deliberately (it re-adjusts subtitles that already carry the adjustment note). Strategies: `noise_floor` (default), `dual_bound`, `peak_relative`, `otsu`; try another only if the result is poor, and say which one you used in `detail`.
  - If `adjust_cue_times` reports media skipped for lack of a waveform, `generate_waveforms` is not actually finished - the audit's `adjust_blocked_no_waveform` check will name them.

  ### Step 5: Close
  1. Call `workflow_verify` with `dataset_uuid`, `run_id` and `apply: true` once at the end: a step the evidence contradicts must not stay green.
  2. Call `dataset_full_report` again, and tell the user: media / subtitle / cue counts, the checks that still have offenders (with the files), the per-step status, and what remains open and why.
  3. If `workflow.runs[0].run_status` is `completed`, say so plainly and stop.

  ## Recovery
  - After any restart or crash call `workflow_status` with `dataset_uuid` and `run_id`: it recomputes derived statuses and reaps expired leases, so a step a dead agent left `running` becomes runnable again. This is what makes the run resumable - read it before doing anything else.
  - **A step sitting at `running` with a `started` but no `completed` event was never reported.** Either the action is still going (a claim lasts the step's `timeout:`, 300s if it declares none) or whoever claimed it stopped. `workflow_status` reaps an expired lease and re-derives the step to `ready`, so no `workflow_intervene` is needed: if the work actually finished on disk, `workflow_record` accepts a completion on a `ready` step; if it did not, `workflow_advance` claims it again and you run the action. Use `intervene` for what it is for - `failed` (`retry`), `blocked` (`unblock`), and a human override.
  - `workflow_intervene` with `dataset_uuid`, `run_id`, `step` and `op` - `retry` (failed -> ready, attempt counter reset), `unblock` (blocked -> pending), `skip`, `reset` (wipe the step's state). These are manual overrides: ask the user before `skip` or `reset`, and never use them to get past a check that is telling the truth.
  - Every transition is journalled in `<dataset>/workflows/<run_id>/events.jsonl`. `completed` after `started` is progress the run earned; `adopted` and `invalidated` are progress it inherited or had taken away. `workflow_list` summarises runs without loading them.

  ## Rules
  - **Pass `dataset_uuid` on every call.** The run lives inside the dataset at `<dataset>/workflows/<run_id>`; a call that names only `run_id` is now located by search, but naming the dataset states which run you mean and is what the app's own Workflow page uses.
  - **A check that could not be measured is not clean.** `count: 0` proves something only when the subject exists - that is what the `media_none` check is for, and why an empty dataset adopts nothing.
  - **Never invent a status.** Statuses come from `workflow_record`, `workflow_verify` and `workflow_adopt`. What you decide is which action to run and what its outputs were. A status you record for a step whose action tool never returned in this session is an invented status, however true the numbers in its `detail` are.
  - **Read-only first.** `dataset_full_report` and `workflow_verify` without `apply` never write; call them as often as you like.
  - **One step at a time.** Subtitle generation and cue adjustment can take minutes on a large dataset. Record each step before starting the next, so an interruption leaves a resumable run rather than an unknown one.
  - **One run per workflow, not per dataset.** Act on `workflow.canonical_run_id` for this recipe's build pipeline; other templates of the same dataset keep their own run (`workflow.expected_runs`), which is a second history on purpose. What is never allowed is a run id you invented: consolidate by finishing or deleting *that*, never by recording the same progress twice.
  - **Stop on error and report it.** Tool messages are written to be actionable - they say what to call next.
