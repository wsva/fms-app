# Dictation dataset processing workflow — a workflow.yaml definition.
# Format: docs/design/workflow/core.md; this pipeline and its scan:
# docs/design/workflow/dictation.md.
#
# This is the app's BUILT-IN template, shipped in the binary via `include_str!`
# (see `src-tauri/src/workflow/templates.rs`) and served to the Workflow page and
# the `workflow_builtin_templates` MCP tool as the single source of truth for the
# Dictation pipeline — it replaces the former duplicate copies that lived in
# `docs/ai/workflow/` and the frontend's `seed.ts`.
#
# One illustrative *instance* of the generic framework: it takes raw audio, produces
# subtitles / waveforms / the cue database, then aligns and adjusts cue times into a
# practice-ready dictation dataset.
#
# Every `action` names an existing MCP tool (mcp/datasets.rs, mcp/dictation.rs,
# mcp/models.rs) or the matching Tauri command; the run is driven agent-in-the-loop:
# `workflow_next` hands the agent the step, the agent calls the tool, then reports back
# with `workflow_record`. Skipped steps satisfy their dependents by default, so the
# optional align branches may both skip cleanly.
#
# `title` is a UI-only short label for the Workflow page's graph nodes; the engine
# ignores unknown fields, so it is safe (and expected) to keep it here.
#
# `verify:` is NOT UI-only: it binds read-only check ids from `dataset_audit` to the
# step they concern, and `workflow_verify` scores this run against them. `blocks`
# means "findings here say: not yet"; `proves` means "findings here say: what this
# step claimed is missing, partial or drifted", which is what entitles a
# `completed` step to be sent back to `ready`. Ids are validated against the
# evaluator's vocabulary when a run is created, so a typo fails the definition
# instead of silently disabling a gate. Four checks stay deliberately unbound —
# `cue_sanity` and `subtitle_versions` have no repairing step, `reference_material`
# and `adjust_blocked_no_waveform` are context — and two steps declare nothing at
# all (`ensure_model`, `detect_reference`) because there is no subject-side
# evidence for them. That is `unknown`, the honest answer, not an oversight.
#
# `adopt:` is the opposite act and the engine's only upward move: the ids listed
# there must come back measured *and* clean, and `workflow_adopt` then records the
# step as completed without running it, because the artifact it would have
# produced is already on disk. Exactly one step asks for it. `database_missing`
# answers a question about one file's existence, which nothing can make vacuously
# true; every per-file check instead reads "zero offenders" on a dataset with no
# media at all, and adopting on that would print a green tick over work nobody did
# — so they stay out. An adoption costs an `adopted` event, so the audit trail
# still distinguishes progress a run earned from progress it inherited.
#
# No step declares `inputs: { dataset_uuid: … }` any more. That value is the
# *subject* the run is bound to — the run directory lives inside the dataset, and
# every command and MCP tool is handed the uuid by its caller — not something
# `init_dataset` produces. Making it a step output meant a dataset initialized
# anywhere else could never be adopted: the completion would carry no outputs and
# every dependent would go `blocked` waiting for one that could not arrive.

name: process_dictation_dataset
# Deliberately NOT bumped when `verify:` was added: the field changes no step
# semantics, exactly like `title:`, and version binding in `load_bundle` would
# otherwise stale every existing `dictation-<uuid>` run over a purely additive
# annotation.
version: 2

steps:
  # ── Stage 0: STT model readiness ────────────────────────────────────────────
  - id: ensure_model
    title: Ensure STT model
    description: >-
      Check model_status; if the preferred model is not downloaded, model_download it,
      then model_load it. transcribe steps below fail without a loaded model.
    action: model_status
    params:
      then: ["model_download", "model_load"]
    outputs:
      - model_version
    retry: { attempts: 2, backoff: "30s" }

  # ── Stage 1: initialize the dataset in place (uuid + info.json + empty DB) ──
  - id: init_dataset
    title: Initialize dataset
    description: >-
      Initialize an existing raw media folder IN PLACE as a dictation dataset:
      mint a uuid, write info.json, and create an EMPTY data.sqlite3 (schema only).
      Media are NOT registered here — the sync_media step below owns the
      listen_media inventory, keeping "set up the folder" and "reconcile media
      into the DB" cleanly separate. (dataset_create is the sibling primitive for
      a brand-new empty dataset from a typed name.)
    action: dataset_init_dir
    params:
      path: "C:/path/to/dataset_folder"   # EDIT: a folder already holding media/
    verify:
      proves: [database_missing]
    # The database file *is* this step's whole output, so its presence is enough
    # to adopt: see the header note on `adopt:` for why no other step may say so.
    adopt: [database_missing]
    outputs:
      - dataset_uuid
      - media_count

  # ── Stage 1b: reconcile the DB's media inventory with the files on disk ────
  - id: sync_media
    title: Sync media
    description: >-
      Update the database to match the files under media/: add a row for each new
      media file, and delete the rows for files that are gone — together with all
      data related to them (subtitles, cues, transcripts). Safe to re-run: if no
      media files were renamed or deleted, it changes nothing.
    action: dataset_sync_media
    depends_on:
      - init_dataset
    verify:
      blocks: [database_missing]
      proves: [media_new, media_gone]
    outputs:
      - added_count
      - removed_count

  # ── Stage 2: two independent artifact branches off sync_media ──────────────
  - id: generate_subtitles
    title: Generate subtitles
    description: >-
      STT-transcribe every media file into VTT subtitles (long-running; progress via
      dataset progress events) AND import them into data.sqlite3: an active
      listen_subtitle + cues (version 1) per media, matched to its listen_media row by
      source and written idempotently. Because generation persists straight to the DB,
      there is no separate "build database" step downstream.
    action: dataset_generate_subtitles
    depends_on:
      - ensure_model
      - sync_media
    verify:
      blocks: [database_missing, media_new]
      proves: [subtitles_missing, subtitles_unreadable, subtitles_not_imported, subtitles_out_of_sync]
    retry: { attempts: 2, backoff: "1m" }

  - id: generate_waveforms
    title: Generate waveforms
    description: Generate waveform JSON for all media via Symphonia peak detection.
    action: dataset_generate_waveforms
    depends_on:
      - sync_media
    verify:
      blocks: [media_new]
      proves: [waveforms_missing, waveforms_stale]

  # ── Stage 2b: the cue DB is filled inline by generate_subtitles ───────────────────────────────────────────────────
  # generate_subtitles already wrote the active listen_subtitle + cues into
  # data.sqlite3, so no separate "build database" step is needed here.

  # ── Stage 3: optional text alignment (guarded by reference material) ────────
  - id: detect_reference
    title: Detect reference
    description: >-
      List dataset files to see whether book.txt and/or transcript/ exist; record
      "true"/"false" in the outputs so the guards below can skip cleanly.
    action: dataset_list_files
    depends_on:
      - generate_subtitles
    outputs:
      - has_book
      - has_transcript

  - id: align_cues
    title: Align cues (book)
    description: Align cue text against book.txt with multi-pass anchor DP matching.
    action: dataset_align_cues
    depends_on:
      - detect_reference
    verify:
      blocks: [subtitles_not_imported]
    when: "${steps.detect_reference.outputs.has_book}"

  - id: align_cues_transcript
    title: Align cues (transcript)
    description: Align cue text against per-subtitle files in transcript/ instead.
    action: dataset_align_cues_transcript
    depends_on:
      - detect_reference
    verify:
      blocks: [subtitles_not_imported]
    when: "${steps.detect_reference.outputs.has_transcript}"

  # ── Stage 4: cue-time refinement (independent of text alignment) ────────────
  - id: adjust_cue_times
    title: Adjust cue times
    description: >-
      Snap cue boundaries to silence detected in the audio. mode=new writes adjusted
      cues alongside the originals; re-run with force=true only deliberately.
    action: dataset_adjust_cue_time
    depends_on:
      - generate_subtitles
      - generate_waveforms
    verify:
      blocks: [waveforms_missing, subtitles_not_imported]
      # The note marker is the only durable trace of an adjustment, so this can
      # only ever mean "some adjustment exists" — never which mode or strategy.
      proves: [cues_unadjusted]
    params:
      mode: "new"
      strategy: "noise_floor"          # or: dual_bound | peak_relative | otsu
