[package]
name = "fms-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fms_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.2.0", default-features = false }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
rfd = { version = "0.14", default-features = false }
dirs = "6"
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
symphonia = { version = "0.5", features = ["all", "opt-simd"] }
rusqlite = { version = "0.31", features = ["bundled"] }
log = "0.4"
tauri-plugin-fs = "2.5.2"
edge-tts-rust = "0.1"
libp2p = { version = "0.56", features = [
    "tokio", "tcp", "noise", "yamux", "mdns",
    "kad", "request-response", "identify", "macros",
    "relay", "autonat", "dcutr",
] }
async-trait = "0.1"
futures = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
