[package]
name = "fms-app"
version = "0.1.0"
description = "Fremdsprachen machen Spaß"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fms_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Feature gating so the mobile (aarch64-linux-android) build never pulls in
# desktop-only native dependencies (file dialogs, screen capture, image
# codec, the axum/rmcp server stack). Local STT (transcribe-rs) is a
# deliberate exception: it ships on Android as the `stt` default feature.
#
# IMPORTANT: `desktop` is deliberately NOT a default feature. The Tauri CLI
# re-applies the manifest `default` features to *every* target (including the
# Android dev/build paths), and it cannot be turned off from the CLI, so
# anything in `default` ships to the Android build as well. The desktop app
# additionally enables `desktop` through `build.features = ["desktop"]` in
# tauri.conf.json.
# - Run a desktop cargo check with: `cargo check --features desktop`.
# - Run a mobile (thin-client) cargo check with: `cargo check
#   --no-default-features`.
# - `desktop` = the full PC build.
# - `stt` = local ONNX speech-to-text (transcribe-rs). It is a *default*
#   feature because the Tauri CLI builds mobile targets from the manifest
#   defaults and does NOT pass `build.features` from tauri.android.conf.json
#   (verified: an android build with `features: ["stt"]` there produced a
#   binary without the model_* commands). Default-enabled is the only lever
#   that reliably reaches the Android cargo invocation. transcribe-cpp
#   (Whisper GGUF) stays desktop-only for now.
# - `server` = the HTTP/MCP web_service, a PC-only subsystem and a dependency of
#   `desktop`. Android consumes the PC over the network, so it compiles none.
[features]
default = ["stt"]
desktop = [
    "stt",
    "dep:transcribe-cpp",
    "dep:rfd",
    "dep:xcap",
    "dep:arboard",
    "dep:image",
    "dep:tauri-plugin-single-instance",
    "dep:goose-sdk",
    "dep:tokio-tungstenite",
    "server",
]
server = [
    "dep:axum",
    "dep:rmcp",
    "dep:tokio-util",
    "dep:tokio-stream",
    "dep:schemars",
    "dep:anyhow",
]
stt = ["dep:transcribe-rs"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-rs = { version = "0.3.11", features = ["onnx"], optional = true }
transcribe-cpp = { version = "0.2.0", default-features = false, optional = true }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# Ed25519 device-identity keypairs for PC<->Android pairing (ring is already
# in the tree via rustls; Android-portable, so it is a plain dependency).
ring = "0.17"
# Direct dependency so we can pin the process-level CryptoProvider at startup.
# Several crates (reqwest, rmcp, goose-sdk, tokio-tungstenite) enable both the
# `ring` and `aws-lc-rs` rustls features through feature unification, which
# makes rustls panic when it cannot auto-select a provider. We install `ring`
# explicitly in lib.rs::install_crypto_provider().
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["full"] }
rfd = { version = "0.15", optional = true }
dirs = "6"
futures-util = "0.3"
base64 = "0.22"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
symphonia = { version = "0.5", features = ["all", "opt-simd"] }
rusqlite = { version = "0.31", features = ["bundled"] }
log = { version = "0.4", features = ["std"] }
lazy_static = "1.4"
tauri-plugin-fs = "2.5.2"
edge-tts-rust = "0.1"
axum = { version = "0.8.9", features = ["multipart"], optional = true }
tokio-util = { version = "0.7", features = ["io", "io-util"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
image = { version = "0.25.10", optional = true }
schemars = { version = "1.0", optional = true }
anyhow = { version = "1", optional = true }
rmcp = { version = "3.4.1", optional = true, features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session", "macros", "schemars"] }
goose-sdk = { version = "0.1.0-alpha.11", features = ["uniffi"], optional = true }
# WebSocket client for the goose ACP agent (desktop only; connects to a local
# `goose serve` over ws://). Already in the tree transitively, so the pinned
# 0.28 resolves from the offline registry cache.
tokio-tungstenite = { version = "0.28", optional = true }

# Windows: native snipping via `ms-screenclip:` + clipboard image read.
[target.'cfg(windows)'.dependencies]
arboard = { version = "3", optional = true }

# macOS/Linux: cross-platform full-screen capture (region crop happens in-app).
[target.'cfg(not(windows))'.dependencies]
xcap = { version = "0.9", optional = true }

# Android: read SAF `content://` URIs picked by the file dialog through the
# ContentResolver (the OS gives no plain filesystem path for them). Both crates
# are already in the tree via Tauri's Android runtime, so this adds no new
# offline-registry fetches; the JNI bridge lives in `ai/chat.rs`.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

