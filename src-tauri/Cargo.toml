[package]
name = "fms-app"
version = "0.1.0"
description = "Fremdsprachen machen Spaß"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fms_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
transcribe-cpp = { version = "0.2.0", default-features = false }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
dirs = "6"
futures-util = "0.3"
base64 = "0.22"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
symphonia = { version = "0.5", features = ["all", "opt-simd"] }
rusqlite = { version = "0.31", features = ["bundled"] }
log = "0.4"
lazy_static = "1.4"
tauri-plugin-fs = "2.5.2"
edge-tts-rust = "0.1"
axum = { version = "0.8.9", features = ["multipart"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
image = "0.25.10"
schemars = "1.0"
anyhow = "1"
rmcp = { version = "3.4.1", features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session", "macros", "schemars"] }

# Windows: native snipping via `ms-screenclip:` + clipboard image read.
[target.'cfg(windows)'.dependencies]
arboard = "3"

# macOS/Linux: cross-platform full-screen capture (region crop happens in-app).
[target.'cfg(not(windows))'.dependencies]
xcap = "0.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

