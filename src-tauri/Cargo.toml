[package]
name = "fms-app"
version = "0.1.0"
description = "Fremdsprachen machen Spaß"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fms_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Feature gating so the mobile (aarch64-linux-android) build never pulls in
# desktop-only native dependencies (file dialogs, screen capture, image
# codec, the axum/rmcp server stack). Local STT (transcribe-rs) is a
# deliberate exception: it ships on Android as the `stt` default feature.
#
# IMPORTANT: `desktop` is deliberately NOT a default feature. The Tauri CLI
# re-applies the manifest `default` features to *every* target (including the
# Android dev/build paths), and it cannot be turned off from the CLI, so
# anything in `default` ships to the Android build as well. The desktop app
# additionally enables `desktop` through `build.features = ["desktop"]` in
# tauri.conf.json.
# - Run a desktop cargo check with: `cargo check --features desktop`.
# - Run a mobile (thin-client) cargo check with: `cargo check
#   --no-default-features`.
# - `desktop` = the full PC build.
# - `stt` = local ONNX speech-to-text (transcribe-rs). It is a *default*
#   feature because the Tauri CLI builds mobile targets from the manifest
#   defaults and does NOT pass `build.features` from tauri.android.conf.json
#   (verified: an android build with `features: ["stt"]` there produced a
#   binary without the model_* commands). Default-enabled is the only lever
#   that reliably reaches the Android cargo invocation. transcribe-cpp
#   (Whisper GGUF) stays desktop-only for now.
# - `server` = the HTTP/MCP web_service, a PC-only subsystem and a dependency of
#   `desktop`. Android consumes the PC over the network, so it compiles none.
# - `phoneme` = the CTC phoneme model behind read-aloud pronunciation scoring
#   (`datasets/read_aloud/gop.rs` + `phoneme.rs`). It must reach Android for the
#   same reason `stt` does, hence default-enabled. `ort-sys` 2.0.0-rc.12 ships
#   `aarch64-linux-android` prebuilts, which match the aarch64-only APK.
[features]
default = ["stt", "phoneme"]
desktop = [
    "stt",
    "phoneme",
    "dep:transcribe-cpp",
    "dep:rfd",
    "dep:xcap",
    "dep:arboard",
    "dep:image",
    "dep:tauri-plugin-single-instance",
    "dep:goose-sdk",
    "dep:tokio-tungstenite",
    "dep:serde_yaml",
    "dep:spellbook",
    "server",
    "textsplit",
]
server = [
    "dep:axum",
    "dep:rmcp",
    "dep:tokio-util",
    "dep:tokio-stream",
    "dep:schemars",
    "dep:anyhow",
]
stt = ["dep:transcribe-rs"]
# Phoneme CTC inference reuses the same `ort`/`ndarray`/`half` versions that
# transcribe-rs and `textsplit` already resolve, so no second ONNX Runtime.
phoneme = ["stt", "dep:ort", "dep:ndarray", "dep:half"]
# Vendored SaT sentence segmentation (ported from wtsplit-rs). Desktop-only: it
# runs the ONNX on the same statically-linked `ort` that `stt` already pulls in
# via transcribe-rs, so `textsplit` depends on `stt` and adds `tokenizers` as
# its only genuinely new crate. `ndarray`/`half` are already in the tree.
textsplit = ["stt", "dep:ort", "dep:tokenizers", "dep:ndarray", "dep:half"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-rs = { version = "0.3.11", features = ["onnx"], optional = true }
# Vendored SaT inference. Reuse the exact `ort`/`ndarray`/`half` versions
# transcribe-rs already resolved (2.0.0-rc.12 / 0.17 / 2.7) so we link against
# the single statically-provided ONNX Runtime rather than a second, dynamic one.
ort = { version = "2.0.0-rc.12", optional = true, features = ["half"] }
ndarray = { version = "0.17", optional = true }
half = { version = "2.4", optional = true, features = ["num-traits"] }
# XLM-RoBERTa subword tokenizer for SaT. Loaded from a local tokenizer.json,
# so no HTTP/hf-hub feature is needed.
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
transcribe-cpp = { version = "0.2.0", default-features = false, optional = true }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# Ed25519 device-identity keypairs for PC<->Android pairing (ring is already
# in the tree via rustls; Android-portable, so it is a plain dependency).
ring = "0.17"
# Direct dependency so we can pin the process-level CryptoProvider at startup.
# Several crates (reqwest, rmcp, goose-sdk, tokio-tungstenite) enable both the
# `ring` and `aws-lc-rs` rustls features through feature unification, which
# makes rustls panic when it cannot auto-select a provider. We install `ring`
# explicitly in lib.rs::install_crypto_provider().
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["full"] }
rfd = { version = "0.15", optional = true }
dirs = "6"
futures-util = "0.3"
bytes = "1"
base64 = "0.22"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
symphonia = { version = "0.5", features = ["all", "opt-simd"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
# NFC normalization for word-level ASR scoring (datasets/asr_metric.rs): STT
# transcripts and reference texts must compare equal regardless of Unicode
# form. Already in the tree transitively, so this adds no new fetches.
unicode-normalization = "0.1"
log = { version = "0.4", features = ["std"] }
lazy_static = "1.4"
tauri-plugin-fs = "2.5.2"
# Edge TTS client, pinned to 0.1.7 for its v2 DRM token. Microsoft now rejects
# the v1 `Sec-MS-GEC` that 0.1.3 sent (a bare SHA-256 digest with a `1-` version
# string): every synthesis answered 403 Forbidden, which reached the UI as "the
# reference voice clip could not be synthesized". 0.1.7 sends the v2
# CS64+SHA-256 token with a `2-` version string, and the handshake succeeds.
edge-tts-rust = "0.1.7"
axum = { version = "0.8.9", features = ["multipart"], optional = true }
tokio-util = { version = "0.7", features = ["io", "io-util"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
image = { version = "0.25.10", optional = true }
schemars = { version = "1.0", optional = true }
anyhow = { version = "1", optional = true }
# YAML parser for workflow definitions (`workflow.yaml`). Desktop-only: the
# workflow engine is reachable solely through the desktop-gated MCP server.
serde_yaml = { version = "0.9", optional = true }
rmcp = { version = "3.4.1", optional = true, features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session", "macros", "schemars"] }
goose-sdk = { version = "0.1.0-alpha.11", features = ["uniffi"], optional = true }
# WebSocket client for the goose ACP agent (desktop only; connects to a local
# `goose serve` over ws://). Already in the tree transitively, so the pinned
# 0.28 resolves from the offline registry cache.
tokio-tungstenite = { version = "0.28", optional = true }
# Hunspell dictionaries for the TSV hyphen decisions in `ocr/` (desktop only),
# parsed in process instead of shelling out to hunspell/nuspell.
spellbook = { version = "0.4", optional = true }

# Windows: native snipping via `ms-screenclip:` + clipboard image read.
[target.'cfg(windows)'.dependencies]
arboard = { version = "3", optional = true }

# macOS/Linux: cross-platform full-screen capture (region crop happens in-app).
[target.'cfg(not(windows))'.dependencies]
xcap = { version = "0.9", optional = true }

# Android: read SAF `content://` URIs picked by the file dialog through the
# ContentResolver (the OS gives no plain filesystem path for them). Both crates
# are already in the tree via Tauri's Android runtime, so this adds no new
# offline-registry fetches; the JNI bridge lives in `ai/chat.rs`.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

