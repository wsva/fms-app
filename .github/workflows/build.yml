# Apple builds: iPhone (iOS) + macOS. Rebuilt on every push — no tags needed.
#
# The previous tag-driven Windows/Linux/Android pipeline is preserved next to
# this file as `build.yml.bak` (GitHub only runs *.yml / *.yaml, so the backup
# is inert).
#
# Deliverables — Actions artifacts and the rolling `latest-build` pre-release:
#   FmS_macos_arm64_<sha>.dmg              Apple Silicon desktop bundle
#   FmS_ios_arm64_<sha>-unsigned.ipa       device arm64 app, unsigned
#
# Why arm64 only: the `desktop` and `stt` features link ONNX Runtime through
# ort-sys, whose prebuilt matrix covers aarch64-apple-darwin and
# aarch64-apple-ios but NOT x86_64-apple-darwin. An Intel or universal build
# fails at link time, so both jobs run on Apple-Silicon runners (macos-15 is
# arm64, same for macos-latest).
#
# Why the iOS build is unsigned: an installable IPA needs an Apple Developer
# certificate plus provisioning profile. `tauri ios build --no-sign` archives
# with CODE_SIGNING_ALLOWED=NO and zips Payload/<App>.app into an unsigned IPA,
# which is what CI can produce without an account. It has to be re-signed
# before it installs (Sideloadly / AltStore with a free Apple ID, or Xcode with
# a paid one). Once an account exists: drop `--no-sign`, add APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD
# and APPLE_TEAM_ID as secrets, and it produces a signed IPA instead.
#
# The macOS bundle is unsigned too. Gatekeeper blocks the first launch of a
# downloaded app; either right-click > Open, or
#   xattr -dr com.apple.quarantine /Applications/FmS.app
# A Developer ID certificate + notarization (APPLE_SIGNING_IDENTITY + APPLE_ID
# + APPLE_PASSWORD + APPLE_TEAM_ID) removes that step.

name: Build FMS App (macOS + iOS)

on:
  # Every branch push. Tags are deliberately excluded: a tag is no longer an
  # input to this pipeline, the commit is.
  push:
    branches: ['**']
  workflow_dispatch:

# A newer push supersedes the in-flight run for the same branch. macOS minutes
# bill at 10x Linux, so a stale build is not worth finishing.
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # macOS desktop bundle (app + dmg)
  # ──────────────────────────────────────────────
  macos:
    name: macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ort-sys has no x86_64-apple-darwin prebuilt, so a non-arm64 runner
      # would fail 20 minutes into the Rust build. Fail in seconds instead.
      - name: Assert an Apple-Silicon runner
        shell: bash
        run: |
          uname -m
          [ "$(uname -m)" = "arm64" ] || { echo "::error::runner is not arm64 - ONNX Runtime has no Intel prebuilt"; exit 1; }

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-arm64

      - name: Install frontend dependencies
        run: pnpm install

      # `build.features = ["desktop"]` in tauri.conf.json enables the full PC
      # app (server, OCR, capture, Goose); `bundle.targets = "all"` yields the
      # .app and the .dmg on macOS.
      - name: Build the macOS bundle
        run: pnpm tauri build

      - name: Collect the .dmg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)"
          if [ -z "$SRC" ]; then
            echo "::error::tauri build produced no .dmg"
            find src-tauri/target/release/bundle -maxdepth 2 -type f | head -50 || true
            exit 1
          fi
          DEST="dist/FmS_macos_arm64_${{ steps.meta.outputs.sha }}.dmg"
          mv "$SRC" "$DEST"

          # Read the bundle back: the marketing version and the slice are what
          # a downloader sees, so assert them instead of trusting the log.
          APP="$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)"
          BIN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          lipo -info "$APP/Contents/MacOS/$BIN"
          lipo -archs "$APP/Contents/MacOS/$BIN" | grep -qw arm64
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FmS-macos-${{ steps.meta.outputs.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────
  # iOS device build (arm64, unsigned)
  # ──────────────────────────────────────────────
  ios:
    name: iOS (arm64, unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Same arm64 constraint as the macOS job, plus a record of the Xcode
      # version the archive was produced with.
      - name: Assert an Apple-Silicon runner
        shell: bash
        run: |
          uname -m
          xcodebuild -version
          [ "$(uname -m)" = "arm64" ] || { echo "::error::runner is not arm64 - ONNX Runtime has no Intel prebuilt"; exit 1; }

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `aarch64` is the only iOS target this pipeline builds; the toolchain
      # action installs the std for it so `ios init` need not touch rustup.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-arm64

      - name: Install frontend dependencies
        run: pnpm install

      # `gen/apple` is generated, never committed: the Xcode project bakes in
      # absolute paths to this machine's cargo registry and Tauri version, the
      # same reason `tauri android init` runs in CI. `--ci` skips the team /
      # bundle-identifier prompts and takes the identifier from tauri.conf.json.
      - name: Initialize the iOS Xcode project
        run: pnpm tauri ios init --ci --skip-targets-install

      # `--no-sign` archives with signing disabled and packages the archived
      # .app into an unsigned IPA at gen/apple/build/<arch>/<app>.ipa.
      # The feature set is the Cargo default (`stt`): the CLI does not apply
      # `build.features` to mobile targets, so this is the same thin-client +
      # local-STT set the Android build ships.
      - name: Build the unsigned IPA
        run: pnpm tauri ios build --target aarch64 --no-sign --ci

      - name: Collect the .ipa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="$(ls src-tauri/gen/apple/build/*/*.ipa 2>/dev/null | head -1 || true)"
          if [ -z "$SRC" ]; then
            echo "::error::tauri ios build produced no .ipa"
            find src-tauri/gen/apple/build -maxdepth 3 -type f | head -50 || true
            exit 1
          fi
          DEST="dist/FmS_ios_arm64_${{ steps.meta.outputs.sha }}-unsigned.ipa"
          mv "$SRC" "$DEST"

          # Read the payload back: bundle id, version and slice decide whether
          # the IPA is installable after re-signing, so assert them.
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$DEST" -d "$RUNNER_TEMP/ipa"
          APP="$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -1)"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "version:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          lipo -info "$APP/$EXE"
          lipo -archs "$APP/$EXE" | grep -qw arm64
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FmS-ios-${{ steps.meta.outputs.sha }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────
  # Rolling pre-release
  # GitHub only serves release assets from a release, and a release needs a
  # tag ref — so this job owns exactly one fixed tag, `latest-build`, and
  # recreates it at the current commit on every run. No tag is ever pushed by
  # hand. Only the default branch refreshes it; feature-branch pushes still
  # get their artifacts from the two jobs above.
  # ──────────────────────────────────────────────
  publish:
    name: Refresh the rolling release
    needs: [macos, ios]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Delete rather than upload over: it also drops the previous tag, and the
      # action below recreates the release at the current commit. Keeps the
      # asset list from growing by one pair per push. There is no checkout in
      # this job, so `gh` needs GH_REPO to know which repository to talk to.
      - name: Drop the previous rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete latest-build --cleanup-tag --yes || true

      - name: Publish the rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (macOS + iOS)
          prerelease: true
          make_latest: false
          body: |
            Rebuilt from commit ${{ github.sha }} on every push to `main`.

            **macOS (Apple Silicon)** — unsigned `.dmg`. Copy `FmS` to
            `/Applications`, then run
            `xattr -dr com.apple.quarantine /Applications/FmS.app`
            (or right-click → Open the first time Gatekeeper blocks it).

            **iOS (arm64)** — unsigned `.ipa`. It cannot install as-is; re-sign
            it first (Sideloadly or AltStore with a free Apple ID, Xcode with a
            paid account), then sideload.
          files: artifacts/*
