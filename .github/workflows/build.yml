# FmS release pipeline: Windows, Linux, Android, macOS and iOS.
#
# Triggers — a build no longer needs a tag:
#   push to any branch   full build of all five targets, rolling pre-release
#   push of a v* tag     same build, but the tag is stamped into the packages
#                        and published as a versioned release
#   pull_request         the sync-conformance tests only (path-filtered)
#   workflow_dispatch    full build, always refreshes the rolling pre-release
#
# Deliverables — Actions artifacts, plus the release assets the last job
# publishes (tag name when the build came from a tag, otherwise `<sha>`):
#   FmS_windows_x64_<ref>.exe / .msi
#   FmS_linux_amd64_<ref>.AppImage / .deb / .rpm
#   FmS_android_arm64_<ref>.apk            (or -unsigned.apk, see below)
#   FmS_macos_arm64_<ref>.dmg              Apple Silicon only
#   FmS_ios_arm64_<ref>-unsigned.ipa       device arm64 app, unsigned
#
# Why arm64 only for Apple: the `desktop` and `stt` features link ONNX Runtime
# through ort-sys, whose prebuilt matrix covers aarch64-apple-darwin and
# aarch64-apple-ios but NOT x86_64-apple-darwin. An Intel or universal build
# fails at link time, so both Apple jobs run on Apple-Silicon runners
# (macos-15 is arm64. Same for macos-latest).
#
# Why arm64 only for Android: ort ships a single Android prebuilt
# (aarch64-linux-android), so armv7/i686/x86_64 cannot link ONNX. minSdk 24
# arm64 covers essentially every device in scope.
#
# Signing — only Android signs in CI. It needs four repo secrets:
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD. Without them the job still succeeds but publishes an
# UNSIGNED APK that Android refuses to install.
#
# The Apple outputs are unsigned: an installable IPA needs an Apple Developer
# certificate plus provisioning profile, which CI does not have.
# `tauri ios build --no-sign` archives with CODE_SIGNING_ALLOWED=NO and zips
# Payload/<App>.app into an unsigned IPA, so it has to be re-signed before it
# installs (Sideloadly / AltStore with a free Apple ID, or Xcode with a paid
# one). Once an account exists: drop `--no-sign`, add APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD
# and APPLE_TEAM_ID as secrets, and it produces a signed IPA instead.
#
# The macOS bundle is unsigned too. Gatekeeper blocks the first launch of a
# downloaded app; either right-click > Open, or
#   xattr -dr com.apple.quarantine /Applications/FmS.app
# A Developer ID certificate + notarization (APPLE_SIGNING_IDENTITY + APPLE_ID
# + APPLE_PASSWORD + APPLE_TEAM_ID) removes that step.

name: Build FMS App

on:
  # Every branch push builds everything. The `branches: ['**']` entry is
  # deliberately broad: the commit is the input, not a hand-made tag. Tag
  # pushes are opted in separately so a versioned release stays possible.
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
  # A PR only has to prove the sync contract still holds; the bundles are
  # built on the branch itself, not on every PR.
  pull_request:
    paths:
      - 'src-tauri/src/sync/**'
      - 'src-tauri/src/conformance.rs'
      - 'src-tauri/src/datasets/cards/sync.rs'
      - 'src-tauri/tests/sync_conformance/**'
      - '.github/workflows/build.yml'

# A newer push supersedes the in-flight run for the same ref. macOS minutes
# bill at 10x Linux, so a stale build is not worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # Sync conformance + provenance unit tests (sync-v2.md §13).
  # Kept separate from the bundles so a contract regression fails fast,
  # in a minute, instead of after a 25-minute toolchain build.
  # ──────────────────────────────────────────────
  conformance:
    name: Sync conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config libclang-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxrandr-dev libx11-dev \
            libdbus-1-dev \
            libwayland-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev

      - name: Run conformance vectors
        working-directory: src-tauri
        run: cargo test --test sync_conformance

      - name: Run provenance unit tests
        working-directory: src-tauri
        run: cargo test --lib sync::client::tests

  # ──────────────────────────────────────────────
  # Desktop builds (Windows, Linux)
  # ──────────────────────────────────────────────
  build-desktop:
    name: ${{ matrix.label }}
    # Bundles are built on pushes / manual dispatch only — a PR runs the
    # conformance job above, not a full platform bundle.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-24.04
            label: Linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `<ref>` on an asset is the tag when one was pushed, otherwise the
      # commit. A branch name would put a '/' into a filename, and the commit
      # is what actually distinguishes two builds of the same branch.
      - name: Resolve build ref
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then REF="$GITHUB_REF_NAME"; else REF="${GITHUB_SHA::7}"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config libclang-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxrandr-dev libx11-dev \
            libdbus-1-dev \
            libwayland-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev

      - name: Install frontend dependencies
        run: pnpm install

      # The tag is the release version, and it has to reach inside the package too.
      # Two separate authorities feed different parts of a release: tauri.conf.json's
      # `version` becomes the Windows app list entry, the deb/rpm metadata and
      # Android's versionName, while Cargo.toml's reaches the binary through
      # CARGO_PKG_VERSION - the `fms-app/<v>` User-Agent and the `version` a hub
      # advertises over /api/v1, which devices compare. Stamp both (and the matching
      # Cargo.lock entry, so the tree the build starts from is self-consistent), so
      # an installed FmS says the same thing the asset name does. The committed
      # 0.1.0 is only a dev placeholder. No `$` anchors anywhere: a Windows checkout
      # may carry CRLF, and the carriage return sits just past these matches.
      #
      # Every bundle job carries this same step: a tag push must produce five
      # packages that all report the same version. `-i.bak` plus the cleanup
      # line instead of a bare `-i`: GNU sed (Linux, Git Bash on Windows) and
      # BSD sed (macOS) disagree about whether -i eats the following word as a
      # backup suffix, so the suffix is written explicitly.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$VER\"/" src-tauri/Cargo.toml
          sed -i.bak "/^name = \"fms-app\"/{n;s/^version = \"[^\"]*\"/version = \"$VER\"/;}" src-tauri/Cargo.lock
          rm -f src-tauri/tauri.conf.json.bak src-tauri/Cargo.toml.bak src-tauri/Cargo.lock.bak
          # These greps double as the assertion: no match means the pattern drifted
          # away from the file, and the build would ship the placeholder again.
          grep -m1 "\"version\": \"$VER\"" src-tauri/tauri.conf.json
          grep -m1 "^version = \"$VER\"" src-tauri/Cargo.toml
          LOCK_V="$(grep -A1 '^name = "fms-app"' src-tauri/Cargo.lock | tail -1 | tr -d '\r')"
          [ "$LOCK_V" = "version = \"$VER\"" ] && echo "Cargo.lock: $LOCK_V"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts for the release
        shell: bash
        run: |
          REF="${{ steps.meta.outputs.ref }}"
          OUT="src-tauri/target/release/bundle"

          # Assets read FmS_<platform>_<arch>_<ref>.<ext>: brand first, and the
          # ref written where a downloader can see it (NSIS's `-setup` suffix
          # and each format's own spelling of the arch are noise), extension
          # kept so the several formats we build per OS stay distinguishable.
          # Files land in bundle/ itself, which is what the upload step globs.
          #
          # Arch comes from the runner, not from the filename Tauri chose,
          # because each package format spells the same arch differently
          # (amd64 on deb, x86_64 on AppImage/rpm, x64 on the Windows
          # installers).
          case "$(uname -m)" in
            x86_64)  ARCH_WIN=x64;   ARCH_NIX=amd64 ;;
            aarch64) ARCH_WIN=arm64; ARCH_NIX=arm64 ;;
            *)       ARCH_WIN="$(uname -m)"; ARCH_NIX="$(uname -m)" ;;
          esac

          for f in "$OUT"/nsis/*.exe "$OUT"/msi/*.msi \
                   "$OUT"/appimage/*.AppImage "$OUT"/deb/*.deb "$OUT"/rpm/*.rpm; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            case "$f" in
              */nsis/*)     plat=windows; arch="$ARCH_WIN" ;;
              */msi/*)      plat=windows; arch="$ARCH_WIN" ;;
              */appimage/*) plat=linux;   arch="$ARCH_NIX" ;;
              */deb/*)      plat=linux;   arch="$ARCH_NIX" ;;
              */rpm/*)      plat=linux;   arch="$ARCH_NIX" ;;
              *) continue ;;
            esac
            dest="$OUT/FmS_${plat}_${arch}_${REF}.${ext}"
            mv -f "$f" "$dest"
            echo "release asset: $(basename "$dest")"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FmS-${{ runner.os }}-${{ steps.meta.outputs.ref }}
          path: |
            src-tauri/target/release/bundle/*.exe
            src-tauri/target/release/bundle/*.msi
            src-tauri/target/release/bundle/*.deb
            src-tauri/target/release/bundle/*.rpm
            src-tauri/target/release/bundle/*.AppImage

  # ──────────────────────────────────────────────
  # Android build (thin client + local STT)
  # Builds the arm64 release APK via `pnpm tauri android build --target aarch64`.
  # ──────────────────────────────────────────────
  build-android:
    name: Android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build ref
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then REF="$GITHUB_REF_NAME"; else REF="${GITHUB_SHA::7}"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # cargo-ndk cross-compiles against this; the Tauri CLI expects the
          # target present rather than adding it itself.
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The Gradle-driven cargo invocation builds into src-tauri/target
          # (not target-android), so that is the directory worth caching.
          workspaces: src-tauri -> target

      # JDK for Gradle 9.6 + the AGP 9 toolchain.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner images ship the Android SDK and NDK side by side with
      # ANDROID_HOME / ANDROID_NDK_HOME already exported, so nothing has to be
      # downloaded here. This step only asserts the image still provides them and
      # lists the available NDKs, so a future image change fails legibly.
      - name: Verify Android toolchain
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:?no NDK on this runner image}"
          java -version
          ls "${ANDROID_NDK_HOME%/*}"
          rustup target list --installed | grep android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install frontend dependencies
        run: pnpm install

      # Same stamping as the desktop job, and it must happen before `android init`:
      # that generates the Gradle project, whose versionName comes from the config.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$VER\"/" src-tauri/Cargo.toml
          sed -i.bak "/^name = \"fms-app\"/{n;s/^version = \"[^\"]*\"/version = \"$VER\"/;}" src-tauri/Cargo.lock
          rm -f src-tauri/tauri.conf.json.bak src-tauri/Cargo.toml.bak src-tauri/Cargo.lock.bak
          grep -m1 "\"version\": \"$VER\"" src-tauri/tauri.conf.json
          grep -m1 "^version = \"$VER\"" src-tauri/Cargo.toml
          LOCK_V="$(grep -A1 '^name = "fms-app"' src-tauri/Cargo.lock | tail -1 | tr -d '\r')"
          [ "$LOCK_V" = "version = \"$VER\"" ] && echo "Cargo.lock: $LOCK_V"

      # `tauri.settings.gradle` is gitignored and holds absolute paths into this
      # machine's ~/.cargo/registry, so `init` must run on the build machine —
      # settings.gradle applies it unconditionally. Because init also rewrites the
      # scaffold, assert right after that it did not strip the manifest
      # customizations the released APK depends on.
      - name: Initialize Android scaffold
        shell: bash
        run: |
          pnpm tauri android init --ci --skip-targets-install
          if ! git diff --quiet -- src-tauri/gen/android/app/src/main/AndroidManifest.xml; then
            echo "::error::tauri android init rewrote AndroidManifest.xml — the APK would lose RECORD_AUDIO / the fms-app:// intent-filter"
            git --no-pager diff -- src-tauri/gen/android/app/src/main/AndroidManifest.xml
            exit 1
          fi

      # Feature selection comes from tauri.android.conf.json — no extra cargo
      # flags (see docs/android-bringup.md). arm64 only: ort has no prebuilt
      # ONNX for the other ABIs.
      - name: Build Android APK
        shell: bash
        run: |
          chmod +x src-tauri/gen/android/gradlew
          pnpm tauri android build --target aarch64 --apk

      # Sign after the build rather than through a Gradle signingConfig:
      # `tauri android init` regenerates app/build.gradle.kts, so a signing block
      # added there would be silently wiped by the next CLI upgrade. zipalign
      # must run before apksigner.
      - name: Sign Android APK
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ steps.meta.outputs.ref }}"
          OUT=src-tauri/gen/android/app/build/outputs/apk

          # `--target aarch64` still lands in universal/release; prefer it so a
          # future multi-ABI build can never sign the wrong APK by accident.
          APK="$(ls "$OUT"/universal/release/*.apk 2>/dev/null | head -1 || true)"
          [ -n "$APK" ] || APK="$(ls "$OUT"/*/release/*.apk 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::no release APK found under $OUT"
            exit 1
          fi
          echo "Signing $APK"
          mkdir -p dist

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - publishing an UNSIGNED APK that Android will refuse to install."
            cp "$APK" "dist/FmS_android_arm64_${REF}-unsigned.apk"
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file - re-copy the whole base64 value"
            exit 1
          fi

          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)"
          "$BT/zipalign" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          # The aligned APK is a positional argument - apksigner has no --in flag
          # and exits 1 with a bare usage error if it is omitted.
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/FmS_android_arm64_${REF}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "dist/FmS_android_arm64_${REF}.apk"
          rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FmS-Android-${{ steps.meta.outputs.ref }}
          path: dist/*.apk

  # ──────────────────────────────────────────────
  # macOS desktop bundle (app + dmg)
  # ──────────────────────────────────────────────
  macos:
    name: macOS (arm64)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 90
    # transcribe-cpp-sys builds ggml through CMake, and ggml's backend loader
    # uses std::filesystem (macOS 10.15+). With no deployment target set,
    # AppleClang considers every API newer than the SDK floor unavailable and
    # the C++ build stops at "'path' is unavailable: introduced in macOS 10.15".
    # Tauri's own minimumSystemVersion only reaches the app crate as a
    # cargo:rustc-env, never a dependency's build script, so it cannot fix
    # this by itself. CMake and cc both read this from the environment, so
    # setting it at job level covers every C/C++ dependency. 11.0 is already
    # the floor for arm64.
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      # ort-sys has no x86_64-apple-darwin prebuilt, so a non-arm64 runner
      # would fail 20 minutes into the Rust build. Fail in seconds instead.
      - name: Assert an Apple-Silicon runner
        shell: bash
        run: |
          uname -m
          [ "$(uname -m)" = "arm64" ] || { echo "::error::runner is not arm64 - ONNX Runtime has no Intel prebuilt"; exit 1; }

      - name: Resolve build ref
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then REF="$GITHUB_REF_NAME"; else REF="${GITHUB_SHA::7}"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-arm64

      - name: Install frontend dependencies
        run: pnpm install

      # Same stamp as the desktop job: a tag push must ship a dmg whose
      # Info.plist reports the tag's version, not the 0.1.0 placeholder.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$VER\"/" src-tauri/Cargo.toml
          sed -i.bak "/^name = \"fms-app\"/{n;s/^version = \"[^\"]*\"/version = \"$VER\"/;}" src-tauri/Cargo.lock
          rm -f src-tauri/tauri.conf.json.bak src-tauri/Cargo.toml.bak src-tauri/Cargo.lock.bak
          grep -m1 "\"version\": \"$VER\"" src-tauri/tauri.conf.json
          grep -m1 "^version = \"$VER\"" src-tauri/Cargo.toml
          LOCK_V="$(grep -A1 '^name = "fms-app"' src-tauri/Cargo.lock | tail -1 | tr -d '\r')"
          [ "$LOCK_V" = "version = \"$VER\"" ] && echo "Cargo.lock: $LOCK_V"

      # `build.features = ["desktop"]` in tauri.conf.json enables the full PC
      # app (server, OCR, capture, Goose); `bundle.targets = "all"` yields the
      # .app and the .dmg on macOS.
      - name: Build the macOS bundle
        run: pnpm tauri build

      - name: Collect the .dmg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)"
          if [ -z "$SRC" ]; then
            echo "::error::tauri build produced no .dmg"
            find src-tauri/target/release/bundle -maxdepth 2 -type f | head -50 || true
            exit 1
          fi
          DEST="dist/FmS_macos_arm64_${{ steps.meta.outputs.ref }}.dmg"
          mv "$SRC" "$DEST"

          # Read the bundle back: the marketing version and the slice are what
          # a downloader sees, so assert them instead of trusting the log.
          APP="$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)"
          BIN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          lipo -info "$APP/Contents/MacOS/$BIN"
          lipo -archs "$APP/Contents/MacOS/$BIN" | grep -qw arm64
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FmS-macos-${{ steps.meta.outputs.ref }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────
  # iOS device build (arm64, unsigned)
  # ──────────────────────────────────────────────
  ios:
    name: iOS (arm64, unsigned)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Same arm64 constraint as the macOS job, plus a record of the Xcode
      # version the archive was produced with.
      - name: Assert an Apple-Silicon runner
        shell: bash
        run: |
          uname -m
          xcodebuild -version
          [ "$(uname -m)" = "arm64" ] || { echo "::error::runner is not arm64 - ONNX Runtime has no Intel prebuilt"; exit 1; }

      - name: Resolve build ref
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then REF="$GITHUB_REF_NAME"; else REF="${GITHUB_SHA::7}"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `aarch64` is the only iOS target this pipeline builds; the toolchain
      # action installs the std for it so `ios init` need not touch rustup.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-arm64

      - name: Install frontend dependencies
        run: pnpm install

      # Same stamp as the desktop job, so the IPA's CFBundleShortVersionString
      # matches the tag instead of the placeholder.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$VER\"/" src-tauri/Cargo.toml
          sed -i.bak "/^name = \"fms-app\"/{n;s/^version = \"[^\"]*\"/version = \"$VER\"/;}" src-tauri/Cargo.lock
          rm -f src-tauri/tauri.conf.json.bak src-tauri/Cargo.toml.bak src-tauri/Cargo.lock.bak
          grep -m1 "\"version\": \"$VER\"" src-tauri/tauri.conf.json
          grep -m1 "^version = \"$VER\"" src-tauri/Cargo.toml
          LOCK_V="$(grep -A1 '^name = "fms-app"' src-tauri/Cargo.lock | tail -1 | tr -d '\r')"
          [ "$LOCK_V" = "version = \"$VER\"" ] && echo "Cargo.lock: $LOCK_V"

      # `gen/apple` is generated, never committed: the Xcode project bakes in
      # absolute paths to this machine's cargo registry and Tauri version, the
      # same reason `tauri android init` runs in CI. `--ci` skips the team /
      # bundle-identifier prompts and takes the identifier from tauri.conf.json.
      - name: Initialize the iOS Xcode project
        run: pnpm tauri ios init --ci --skip-targets-install

      # `--no-sign` archives with signing disabled and packages the archived
      # .app into an unsigned IPA at gen/apple/build/<arch>/<app>.ipa.
      #
      # The feature set comes from src-tauri/tauri.ios.conf.json, which the CLI
      # merges over tauri.conf.json for iOS: `stt` only. Without it the build
      # inherits `build.features = ["desktop"]` from the base config and tries
      # to compile the whole PC stack for iOS (xcap has no iOS platform module),
      # so this file is what keeps the iOS target to the thin-client set.
      - name: Build the unsigned IPA
        run: pnpm tauri ios build --target aarch64 --no-sign --ci

      - name: Collect the .ipa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="$(ls src-tauri/gen/apple/build/*/*.ipa 2>/dev/null | head -1 || true)"
          if [ -z "$SRC" ]; then
            echo "::error::tauri ios build produced no .ipa"
            find src-tauri/gen/apple/build -maxdepth 3 -type f | head -50 || true
            exit 1
          fi
          DEST="dist/FmS_ios_arm64_${{ steps.meta.outputs.ref }}-unsigned.ipa"
          mv "$SRC" "$DEST"

          # Read the payload back: bundle id, version and slice decide whether
          # the IPA is installable after re-signing, so assert them.
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$DEST" -d "$RUNNER_TEMP/ipa"
          APP="$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -1)"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "version:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          lipo -info "$APP/$EXE"
          lipo -archs "$APP/$EXE" | grep -qw arm64
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FmS-ios-${{ steps.meta.outputs.ref }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────
  # Publish
  # GitHub only serves release assets from a release, and a release needs a
  # tag ref. Two outcomes:
  #   tag push  -> a normal release at that tag, release notes generated
  #   otherwise -> one rolling pre-release, always tagged `latest-build` and
  #                recreated at the current commit, so nobody pushes a tag by
  #                hand and the asset list never grows by five per push.
  # Only the default branch refreshes the rolling one; feature-branch pushes
  # still get their artifacts from the jobs above.
  # ──────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [build-desktop, build-android, macos, ios]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Delete rather than upload over: it also drops the previous tag, and the
      # action below recreates the release at the current commit. There is no
      # checkout in this job, so `gh` needs GH_REPO to know which repository
      # to talk to.
      - name: Drop the previous rolling release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete latest-build --cleanup-tag --yes || true

      - name: Publish the rolling pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Rebuilt from commit ${{ github.sha }} on every push to `main`.

            **Windows / Linux / Android** — installers as built; the APK is
            signed only when the Android signing secrets are configured.

            **macOS (Apple Silicon)** — unsigned `.dmg`. Copy `FmS` to
            `/Applications`, then run
            `xattr -dr com.apple.quarantine /Applications/FmS.app`
            (or right-click -> Open the first time Gatekeeper blocks it).

            **iOS (arm64)** — unsigned `.ipa`. It cannot install as-is; re-sign
            it first (Sideloadly or AltStore with a free Apple ID, Xcode with a
            paid account), then sideload.
          files: artifacts/*
          fail_on_unmatched_files: false

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FmS ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
