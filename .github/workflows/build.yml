name: Build FMS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/src/sync/**'
      - 'src-tauri/src/conformance.rs'
      - 'src-tauri/src/datasets/cards/sync.rs'
      - 'src-tauri/tests/sync_conformance/**'
      - '.github/workflows/build.yml'

jobs:
  # ──────────────────────────────────────────────
  # Sync conformance + provenance unit tests (sync-v2.md §13).
  # Runs on every PR that touches the sync subsystem and on every
  # release tag. Deliberately separate from the bundle builds so a
  # contract regression fails fast without a full Tauri build.
  # ──────────────────────────────────────────────
  conformance:
    name: Sync conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config libclang-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxrandr-dev libx11-dev \
            libdbus-1-dev \
            libwayland-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev

      - name: Run conformance vectors
        working-directory: src-tauri
        run: cargo test --test sync_conformance

      - name: Run provenance unit tests
        working-directory: src-tauri
        run: cargo test --lib sync::client::tests

  # ──────────────────────────────────────────────
  # Desktop builds (Windows, Linux)
  # ──────────────────────────────────────────────
  build-desktop:
    name: ${{ matrix.label }}
    # Release bundles are built on tags / manual dispatch only — a PR runs the
    # conformance job above, not a full platform bundle.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-24.04
            label: Linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config libclang-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxrandr-dev libx11-dev \
            libdbus-1-dev \
            libwayland-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts with tag
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          OUT="src-tauri/target/release/bundle"

          for f in "$OUT"/nsis/*.exe "$OUT"/msi/*.msi \
                   "$OUT"/appimage/*.AppImage "$OUT"/deb/*.deb "$OUT"/rpm/*.rpm; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            name="${base%.*}"
            ext="${base##*.}"
            mv "$f" "$OUT/${name}-${TAG}.${ext}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fms-app-${{ runner.os }}-${{ steps.tag.outputs.tag }}
          path: |
            src-tauri/target/release/bundle/*.exe
            src-tauri/target/release/bundle/*.msi
            src-tauri/target/release/bundle/*.deb
            src-tauri/target/release/bundle/*.rpm
            src-tauri/target/release/bundle/*.AppImage

  # ──────────────────────────────────────────────
  # Android build (thin client + local STT)
  # Builds release APKs for arm64 and x86_64 via `pnpm tauri android build`.
  # No keystore is configured, so the output is an unsigned release APK —
  # installable after zipalign+apksigner, or wire up an ANDROID_KEYSTORE
  # secret later to produce signed artifacts.
  # ──────────────────────────────────────────────
  build-android:
    name: Android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-android

      # JDK for Gradle + the Android SDK/NDK toolchain (Tauri needs NDK >= 25.2).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + build tools
        shell: bash
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install

      # Generates any missing cargo config for the android targets, then builds
      # release APKs (arm64 + x86_64). Feature selection comes from
      # tauri.android.conf.json — no extra cargo flags (see docs/android-bringup.md).
      - name: Build Android APKs
        run: pnpm tauri android init && pnpm tauri android build

      - name: Rename artifacts with tag
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          OUT=src-tauri/gen/android/app/build/outputs/apk
          for f in "$OUT"/*/release/*.apk; do
            [ -f "$f" ] || continue
            dir="$(dirname "$f")"
            base="$(basename "$f")"
            mv "$f" "$dir/${base%.apk}-${TAG}.apk"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fms-app-Android-${{ steps.tag.outputs.tag }}
          path: src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk

  # ──────────────────────────────────────────────
  # Create GitHub Release
  # ──────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-desktop, build-android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FMS App ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.apk
