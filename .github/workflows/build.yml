name: Build FMS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Desktop builds (Windows, Linux)
  # ──────────────────────────────────────────────
  build-desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-24.04
            label: Linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config libclang-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxrandr-dev libx11-dev \
            libdbus-1-dev \
            libwayland-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifacts with tag
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          OUT="src-tauri/target/release/bundle"

          for f in "$OUT"/nsis/*.exe "$OUT"/msi/*.msi \
                   "$OUT"/appimage/*.AppImage "$OUT"/deb/*.deb "$OUT"/rpm/*.rpm; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            name="${base%.*}"
            ext="${base##*.}"
            mv "$f" "$OUT/${name}-${TAG}.${ext}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fms-app-${{ runner.os }}-${{ steps.tag.outputs.tag }}
          path: |
            src-tauri/target/release/bundle/*.exe
            src-tauri/target/release/bundle/*.msi
            src-tauri/target/release/bundle/*.deb
            src-tauri/target/release/bundle/*.rpm
            src-tauri/target/release/bundle/*.AppImage

  # ──────────────────────────────────────────────
  # Create GitHub Release
  # ──────────────────────────────────────────────
  release:
    name: Create Release
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FMS App ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
